name: Contributions currently closed
on:
  pull_request_target:
    types: [opened, reopened]
permissions:
  contents: read
  pull-requests: write
jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - name: Close without executing submitted code
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr close "$PR_NUMBER" --comment "External contributions are currently closed. Please see CONTRIBUTING.md. Security reports: support@onyxchat.site."
